services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcs
      POSTGRES_PASSWORD: tcs
      POSTGRES_DB: trading_card_studio
    ports:
      - "5432:5432"
    volumes:
      - tcs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcs -d trading_card_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tcs_pg_data:
